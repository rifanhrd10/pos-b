name: Deploy POS to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bayaro_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for schema drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bayaro_pos_test
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code || (echo "❌ Schema drift detected! Run 'prisma migrate dev' to create a migration file." && exit 1)

  build-and-push:
    runs-on: ubuntu-latest
    needs: check-migrations
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          MOBILE_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,AUTH_SECRET,MOBILE_AUTH_SECRET,GEMINI_API_KEY
          script_stop: true
          script: |
            set -e
            cd /var/www/bayaro/pos-b
            git stash
            git pull origin main
            echo "AUTH_SECRET=${AUTH_SECRET}" > .env
            echo "MOBILE_AUTH_SECRET=${MOBILE_AUTH_SECRET}" >> .env
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            docker compose pull pos-app
            docker compose up -d --no-build --remove-orphans
            # Wait until pos-app is healthy before running migrations
            echo "Waiting for pos-app to be ready..."
            for i in $(seq 1 30); do
              if docker exec pos-app npx prisma migrate deploy 2>&1; then
                echo "✅ Migrations applied successfully"
                break
              fi
              echo "Attempt $i/30 failed, retrying in 3s..."
              sleep 3
              if [ $i -eq 30 ]; then
                echo "❌ Migration failed after 30 attempts"
                exit 1
              fi
            done
            docker image prune -f
