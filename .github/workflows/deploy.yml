name: Deploy POS to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bayaro_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for schema drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bayaro_pos_test
        run: |
          # Apply all existing migrations to fresh test DB
          npx prisma migrate deploy

          # Check status - fails if there are pending/unapplied migrations
          STATUS=$(npx prisma migrate status 2>&1)
          echo "$STATUS"
          if echo "$STATUS" | grep -q "Following migrations have not yet been applied"; then
            echo "❌ There are unapplied migrations. Run 'npx prisma migrate dev' locally."
            exit 1
          fi

          # Check if schema.prisma has changes beyond what's in migrations
          DIFF=$(npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --script 2>&1 || true)
          echo "Schema diff output: $DIFF"
          if echo "$DIFF" | grep -qiE "^(CREATE|ALTER|DROP) "; then
            echo "❌ Schema has changes not covered by any migration file!"
            echo "Run: npx prisma migrate dev --name <migration_name>"
            exit 1
          fi
          echo "✅ Schema is in sync with migrations"

  build-and-push:
    runs-on: ubuntu-latest
    # Run in parallel with check-migrations — no dependency between them
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [check-migrations, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          MOBILE_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,AUTH_SECRET,MOBILE_AUTH_SECRET,GEMINI_API_KEY
          script_stop: true
          script: |
            set -e
            cd /var/www/bayaro/pos-b
            git stash
            git pull origin main
            echo "AUTH_SECRET=${AUTH_SECRET}" > .env
            echo "MOBILE_AUTH_SECRET=${MOBILE_AUTH_SECRET}" >> .env
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            docker compose pull pos-app
            docker compose up -d --no-build --remove-orphans
            # Wait for container healthy then run migration once
            echo "Waiting for pos-app to be ready..."
            timeout 90 bash -c 'until docker exec pos-app npx prisma migrate deploy 2>&1; do sleep 3; done'
            echo "✅ Migrations applied successfully"
            docker image prune -f
